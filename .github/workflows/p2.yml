# P2 (riesgo de estación): features y entrenamiento del baseline histórico y del HistGradientBoosting.
#
# Se puede correr sola (pestaña Actions > P2 > Run workflow) o desde la acción de las tres
# preguntas (TC5061-Proyecto-Equipo07.yml), que la llama con `workflow_call` después de la calidad.
# Responsable: Fernando Arreola Treviño (notebooks *-fat-*, rama feat/p2).
#
# Secret del repositorio (Settings > Secrets and variables > Actions > Secrets):
#   MLFLOW_TRACKING_URI  URL del servidor MLflow (solo se usa si se marca `registrar`)
# Nombre de los runs (lo fija el workflow):
# Tarea: clasificar si una estación se quedará sin bicicletas o sin anclajes
name: P2 - riesgo de estación

on:
  workflow_dispatch:
    inputs:
      nombre_run:
        description: "Forzar el prefijo de los runs de MLflow (vacío: mibici-equipo07-p2). Quedan <valor>-baseline-historico y <valor>-hgb"
        type: string
        default: ""
      registrar:
        description: "Registrar los runs en MLflow (escribe en el servidor del equipo)"
        type: boolean
        default: false
      de_nuevo:
        description: "Sin efecto en P2 (cada registro crea runs nuevos)"
        type: boolean
        default: false
      peso_historico:
        description: "Peso (en días) de la frecuencia global en la historia (vacío: P2_PESO_HISTORICO de config.py)"
        type: string
        default: ""
      min_samples_leaf:
        description: "min_samples_leaf del HistGradientBoosting (vacío: P2_MIN_SAMPLES_LEAF de config.py)"
        type: string
        default: ""
  workflow_call:
    inputs:
      registrar:
        type: boolean
        default: false
      de_nuevo:
        type: boolean
        default: false
      prefijo_run:
        description: "Prefijo del nombre de los runs de MLflow (si no se pasa, mibici-equipo07-p2)"
        type: string
        default: mibici-equipo07-p2

permissions:
  contents: read

# Un solo entrenamiento a la vez por rama, para no duplicar registros en MLflow
concurrency:
  group: p2-${{ github.ref }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_RUN_NAME: ${{ inputs.nombre_run || inputs.prefijo_run || 'mibici-equipo07-p2' }}
      P2_REGISTRAR_MLFLOW: ${{ inputs.registrar }}
      P2_PESO_HISTORICO: ${{ inputs.peso_historico }}
      P2_MIN_SAMPLES_LEAF: ${{ inputs.min_samples_leaf }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Comprobar la URL de MLflow
        if: ${{ inputs.registrar }}
        run: test -n "$MLFLOW_TRACKING_URI" || (echo "Falta el secret MLFLOW_TRACKING_URI" && exit 1)
      - name: Restaurar los CSV de data/raw
        # La clave cambia solo si cambia el manifiesto (registros y SHA-256 de cada archivo)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: datos-raw-${{ hashFiles('references/fuentes-datos.csv') }}
      - name: Datos (descarga lo que falte, construye y limpia)
        # Equivale a `make data` sin reinstalar dependencias
        run: python -m tc5061_proyecto_equipo07.dataset todo
      - name: Features de P2
        run: make features-p2
      - name: Entrenamiento de P2
        run: make train-p2
      - name: Subir figuras y tablas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-resultados
          path: reports/figures/p2_*
          if-no-files-found: warn
