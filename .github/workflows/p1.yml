# P1: viajes que inician por estación-hora, un día adelante (baseline, HGB Poisson y XGBoost Poisson).
# Se corre sola (Actions > P1 > Run workflow) o desde la acción de las tres preguntas.
# Con `registrar` escribe los runs en el servidor MLflow del equipo (secret MLFLOW_TRACKING_URI).
name: P1 - viajes por estación-hora

on:
  workflow_dispatch:
    inputs:
      registrar:
        description: "Registrar los runs en MLflow (escribe en el servidor del equipo)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      registrar:
        type: boolean
        default: false

permissions:
  contents: read

# Un solo entrenamiento a la vez por rama, para no duplicar runs en MLflow
concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      P1_REGISTRAR_MLFLOW: ${{ inputs.registrar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Comprobar la URL de MLflow
        if: ${{ inputs.registrar }}
        run: test -n "$MLFLOW_TRACKING_URI" || (echo "Falta el secret MLFLOW_TRACKING_URI" && exit 1)
      - name: Restaurar los CSV de data/raw
        # Misma clave que P2 y P3: la descarga se comparte mientras no cambie el manifiesto
        uses: actions/cache@v4
        with:
          path: data/raw
          key: datos-raw-${{ hashFiles('references/fuentes-datos.csv') }}
      - name: Datos (descarga lo que falte, construye y limpia)
        run: python -m tc5061_proyecto_equipo07.dataset todo
      - name: Features y entrenamiento de P1
        # train-p1 depende de features-p1 en el Makefile
        run: make train-p1
      - name: Subir figuras y tablas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-resultados
          path: reports/figures/p1_*
          if-no-files-found: warn
