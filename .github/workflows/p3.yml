# P3 (clustering de estaciones): calidad y entrenamiento.
#
# Se puede correr sola (pestaña Actions > P3 > Run workflow) o desde la acción de las tres
# preguntas (TC5061-Proyecto-Equipo07.yml), que la llama con `workflow_call` y ya trae la calidad.
# La calidad en los PR la corre TC5061-Proyecto-Equipo07.yml, para no repetirla tres veces.
#
# - `calidad` (ruff y pytest, sin datos) se omite si la acción que llama ya la corrió.
# - `entrenar` descarga los datos, genera features, entrena el baseline y el modelo alternativo
#   y, si se pide, los registra en MLflow.
# Responsable: Luis Arturo Sánchez Davila (notebooks *-lasd-*). Sirve de modelo para p1.yml y p2.yml.
#
# Secret del repositorio (Settings > Secrets and variables > Actions > Secrets):
#   MLFLOW_TRACKING_URI  URL del servidor MLflow (secret: no se muestra en los logs)
# Nombre de los runs (lo fija el workflow, ya no es una variable del repositorio):
#   sola (Run workflow en p3)                  -> `mibici-equipo07-p3-baseline` y `mibici-equipo07-p3-pca_kmeans`
#   desde TC5061-Proyecto-Equipo07.yml (todas) -> `mibici-equipo07-todas-p3-baseline` y `mibici-equipo07-todas-p3-pca_kmeans`
# Para forzar el nombre al correrla sola, se llena el campo `nombre_run` de Run workflow: los runs
# quedan `<nombre_run>-baseline` y `<nombre_run>-pca_kmeans` (tiene prioridad sobre los de arriba).
# Si el servidor exigiera credenciales también irían en secrets (MLFLOW_TRACKING_USERNAME/PASSWORD).
name: P3 - clustering de estaciones

on:
  workflow_dispatch:
    inputs:
      nombre_run:
        description: "Forzar el prefijo de los runs de MLflow (vacío: mibici-equipo07-p3). Quedan <valor>-baseline, etc."
        type: string
        default: ""
      registrar:
        description: "Registrar los runs en MLflow (escribe en el servidor del equipo)"
        type: boolean
        default: false
      de_nuevo:
        description: "Crear un run nuevo aunque ya exista uno terminado con ese nombre"
        type: boolean
        default: false
      exigir_aceptacion:
        description: "Fallar el job si el modelo alternativo no cumple los criterios de aceptación"
        type: boolean
        default: false
  workflow_call:
    inputs:
      registrar:
        type: boolean
        default: false
      de_nuevo:
        type: boolean
        default: false
      exigir_aceptacion:
        type: boolean
        default: false
      prefijo_run:
        description: "Prefijo del nombre de los runs de MLflow (si no se pasa, mibici-equipo07-p3)"
        type: string
        default: mibici-equipo07-p3
      omitir_calidad:
        description: "La acción que llama ya corrió la calidad"
        type: boolean
        default: false

permissions:
  contents: read

# Un solo entrenamiento a la vez por rama, para no duplicar registros en MLflow
concurrency:
  group: p3-${{ github.ref }}
  cancel-in-progress: false

env:
  MPLBACKEND: Agg

jobs:
  calidad:
    if: ${{ !inputs.omitir_calidad }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Formato y lint de los módulos de P3
        run: |
          ruff format --check tc5061_proyecto_equipo07
          ruff check tc5061_proyecto_equipo07/features.py tc5061_proyecto_equipo07/plots.py tc5061_proyecto_equipo07/modeling
      - name: Lint de todo el paquete (informativo)
        # dataset.py trae un aviso anterior a P3 (FURB192); no bloquea hasta que el equipo lo corrija
        continue-on-error: true
        run: ruff check tc5061_proyecto_equipo07
      - name: Pruebas
        # Ya corre todo `tests/`: P1 y P2 solo agregan sus archivos (test_p1_*.py, test_p2_*.py)
        run: pytest tests -q

  entrenar:
    # Corre aunque `calidad` se omita (la llamó otra acción); falla si `calidad` falló
    needs: calidad
    if: ${{ !cancelled() && (needs.calidad.result == 'success' || needs.calidad.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_RUN_NAME: ${{ inputs.nombre_run || inputs.prefijo_run || 'mibici-equipo07-p3' }}
      P3_REGISTRAR_MLFLOW: ${{ inputs.registrar }}
      P3_REGISTRAR_DE_NUEVO: ${{ inputs.de_nuevo }}
      P3_EXIGIR_ACEPTACION: ${{ inputs.exigir_aceptacion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Comprobar la URL de MLflow
        if: ${{ inputs.registrar }}
        run: test -n "$MLFLOW_TRACKING_URI" || (echo "Falta el secret MLFLOW_TRACKING_URI" && exit 1)
      - name: Restaurar los CSV de data/raw
        # La clave cambia solo si cambia el manifiesto (registros y SHA-256 de cada archivo)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: datos-raw-${{ hashFiles('references/fuentes-datos.csv') }}
      - name: Datos (descarga lo que falte, construye y limpia)
        # Equivale a `make data` sin reinstalar dependencias
        run: python -m tc5061_proyecto_equipo07.dataset todo
      - name: Features de P3
        run: make features-p3
      - name: Entrenamiento de P3
        run: make train-p3
      - name: Subir figuras y tablas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-resultados
          path: reports/figures/p3_*
          if-no-files-found: warn
