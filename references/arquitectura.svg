<text x="1530" y="122" font-size="12" font-family="Menlo, Consolas, monospace" fill="#3e4c59">log_*</text>
<path d="M735,520 L735,545 L1730,545 L1730,492" fill="none" stroke="#2e8b6e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#av)"/>
<text x="900" y="538" font-size="12" font-family="Menlo, Consolas, monospace" fill="#2e8b6e">data_version: la misma versión de datos queda en cada run</text>
<text x="30" y="40" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770"></text>
<text x="30" y="590" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5b6770">CÓDIGO Y AUTOMATIZACIÓN</text>
<rect x="30" y="605" width="420" height="120" rx="6" fill="#f4f6f8" stroke="#5b6770" stroke-width="1.5"/>
<text x="46" y="633" font-size="16" font-weight="700" fill="#1f2933">GitHub (Cookiecutter Data Science)</text>
<text x="46" y="654" font-size="13" font-weight="400" fill="#3e4c59">rama propia → PR revisado → EDA → main</text>
<text x="46" y="675" font-size="13" font-weight="400" fill="#3e4c59">main protegida; Conventional Commits</text>
<text x="46" y="696" font-size="13" font-weight="400" fill="#3e4c59">config.py: rutas, fechas, semilla y partición</text>
<rect x="480" y="605" width="340" height="120" rx="6" fill="#f4f6f8" stroke="#5b6770" stroke-width="1.5"/>
<text x="496" y="633" font-size="16" font-weight="700" fill="#1f2933">Makefile</text>
<text x="496" y="654" font-size="13" font-weight="400" fill="#3e4c59">make data · features · train</text>
<text x="496" y="675" font-size="13" font-weight="400" fill="#3e4c59">un target por pregunta (-p1, -p2, -p3)</text>
<text x="496" y="696" font-size="13" font-weight="400" fill="#3e4c59">train-p1 depende de features-p1</text>
<rect x="850" y="605" width="520" height="120" rx="6" fill="#f4f6f8" stroke="#5b6770" stroke-width="1.5"/>
<text x="866" y="633" font-size="16" font-weight="700" fill="#1f2933">GitHub Actions</text>
<text x="866" y="654" font-size="13" font-weight="400" fill="#3e4c59">En cada PR: ruff y pytest</text>
<text x="866" y="675" font-size="13" font-weight="400" fill="#3e4c59">A mano: entrenamiento por pregunta (p1.yml, p2.yml, p3.yml)</text>
<text x="866" y="696" font-size="13" font-weight="400" fill="#3e4c59">y registro en MLflow con el secret MLFLOW_TRACKING_URI</text>
